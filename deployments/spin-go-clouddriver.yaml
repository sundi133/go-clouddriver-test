package main

import (
	"os"

	"gopkg.in/yaml.v3"
)

func main() {
	manifest := os.Getenv("K8S_MANIFEST")
	if manifest == "" {
		return
	}

	var v any
	_ = yaml.Unmarshal([]byte(manifest), &v)
	_, _ = os.Stdout.WriteString(manifest)
}
